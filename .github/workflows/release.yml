# Build Windows + macOS installers and attach to one GitHub Release per app-version tag.
# Milestone tags (v5.0.0, v6.0.0) do NOT match. See RELEASING.md.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: universal-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Verify package lock
        shell: bash
        run: |
          test -f package-lock.json || { echo "package-lock.json is required for npm ci"; exit 1; }
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DonePath ${{ github.ref_name }}
          releaseBody: |
            DonePath **${{ github.ref_name }}** for Windows and macOS.

            **Privacy:** Installers do not include user data. Each install uses a fresh local SQLite database. See [RELEASING.md](https://github.com/${{ github.repository }}/blob/v7/RELEASING.md).

            ### Windows
            Download `DonePath_*_x64-setup.exe`. If SmartScreen appears, choose **More info → Run anyway** (unsigned build).

            ### macOS (Apple Silicon + Intel)
            Download `DonePath_*_universal.dmg`. First launch: **right-click → Open**, or **System Settings → Privacy & Security → Open Anyway** (unsigned build).

            ### Files
            - **Windows:** NSIS `.exe` (recommended) and MSI
            - **macOS:** `.dmg` with universal `.app`
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
