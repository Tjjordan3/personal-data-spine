# Build Windows installers and attach them to a GitHub Release when a v* tag is pushed.
# See RELEASING.md — installers are not committed to the repository.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify package lock
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) {
            throw "package-lock.json is required for npm ci"
          }
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate release notes
        id: release_notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $prev = ""
          try {
            $prev = (git describe --tags --abbrev=0 "HEAD^" 2>$null).Trim()
          } catch {
            $prev = ""
          }

          $changelog = ""
          if ($prev) {
            $changelog = (git log "$prev..HEAD" --pretty=format:"- %s (%h)" --no-merges) -join "`n"
          }

          $generated = ""
          if (Get-Command gh -ErrorAction SilentlyContinue) {
            try {
              $generated = (gh release generate-notes --tag $tag --repo $repo 2>$null | Out-String).Trim()
            } catch {
              $generated = ""
            }
          }

          $body = @"
          Windows x64 installer for DonePath **$tag**.

          **Privacy:** The installer does not include any user data. Each install uses a fresh local SQLite database on that machine. See [RELEASING.md](https://github.com/$repo/blob/v7/RELEASING.md).

          ### Install
          Download ``DonePath_*_x64-setup.exe`` and run it. If SmartScreen appears, choose **More info → Run anyway** (unsigned build).

          ### Files
          - **NSIS setup (.exe)** — recommended for most users
          - **MSI** — alternative installer format
          "@.Trim()

          if ($generated) {
            $body += "`n`n### Release notes`n`n$generated"
          } elseif ($changelog) {
            $label = if ($prev) { "Changes since $prev" } else { "Changes" }
            $body += "`n`n### $label`n`n$changelog"
          }

          $outFile = Join-Path $PWD "release_body.md"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($outFile, $body, $utf8NoBom)

          # Multiline GITHUB_OUTPUT without UTF-8 BOM (Out-File -Encoding utf8 breaks delimiters on Windows).
          $delimiter = "RELEASE_BODY_EOF"
          if ($body -match $delimiter) {
            throw "Release body must not contain delimiter $delimiter"
          }
          $enc = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "body<<$delimiter`n", $enc)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, $body + "`n", $enc)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$delimiter`n", $enc)

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DonePath ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
