# Fast frontend CI on pull requests and branch pushes (no Tauri/Rust build).
# Full Windows installer builds run only on version tags — see release.yml.

name: CI

on:
  pull_request:
    branches: [main, v6]
  push:
    branches: [main, v6]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test
