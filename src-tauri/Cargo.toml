[package]
name = "personal-data-spine"
version = "0.3.4"
description = "DonePath — local-first tasks, meetings, and focus on your computer"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "personal_data_spine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Must match tauri.conf.json productName ("DonePath") so macOS CFBundleExecutable
# finds Contents/MacOS/DonePath when double-clicking the .app (see tauri#13874).
[[bin]]
name = "DonePath"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

