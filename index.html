<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DonePath</title>
    <!-- Apply theme before bundled JS (matches src/index.css + src/lib/settings.ts) -->
    <script>
      (function () {
        try {
          var SETTINGS_KEY = "pds-settings";
          var raw = localStorage.getItem(SETTINGS_KEY);
          var theme = "system";
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed.theme === "string") theme = parsed.theme;
          }
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html.dark,
      html.dark body {
        background-color: #09090b;
        color: #f4f4f5;
      }
      html:not(.dark) body {
        background-color: #fafafa;
        color: #0f0f0f;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji",
          "Segoe UI Emoji";
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
      }
      #root:has(> .pds-splash) {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pds-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        padding: 2rem;
      }
      .pds-splash-logo {
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      .pds-splash-sub {
        font-size: 0.7rem;
        opacity: 0.65;
      }
      .pds-splash-dots {
        display: flex;
        gap: 0.35rem;
        margin-top: 0.5rem;
      }
      .pds-splash-dots span {
        width: 0.35rem;
        height: 0.35rem;
        border-radius: 9999px;
        background: currentColor;
        opacity: 0.35;
        animation: pds-bounce 1.1s ease-in-out infinite;
      }
      .pds-splash-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .pds-splash-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes pds-bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.35;
        }
        40% {
          transform: translateY(-4px);
          opacity: 0.9;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="pds-splash" aria-live="polite" aria-busy="true">
        <div class="pds-splash-logo">DonePath</div>
        <div class="pds-splash-sub">
          Local-first tasks, meetings, and focus on your computer
        </div>
        <div class="pds-splash-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
